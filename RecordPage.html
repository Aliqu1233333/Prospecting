<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prospecting Record Page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #f3f3f3;
  --card: #ffffff;
  --surface: #ffffff;
  --line: #e5e7eb;
  --line-2: #dbe0e6;
  --text: #1f2937;
  --muted: #6b7280;
  --muted-2: #9aa3af;
  --blue: #0176d3;
  --navy: #032d60;
  --heading: #122349;

  --radius: 12px;
  --border-color: #e9ebee;
  --shadow: 0 1px 0 rgba(0,0,0,.02);
  --font: "Inter", "Salesforce Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
*{ box-sizing: border-box; }
body{
  margin:0;
  font-weight:400;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
}
button{ font-family: var(--font); }

.app{ width:100%; padding: 4px 24px 24px 24px; }
.layout{ display:grid; grid-template-columns:1fr; gap:0; width:100%; }
.panel{ background:transparent; border:0; border-radius:0; box-shadow:none; overflow:visible; }

/* ---------- RECORD HEADER ---------- */
.recHeader{
  display:flex; align-items:center; justify-content:space-between;
  gap:16px; padding: 0 4px 8px 4px; background:transparent; border:0;
}
.recIdent{ display:flex; align-items:center; gap:15px; min-width:0; }
.recIcon{
  width:44px; height:44px; border-radius:50%; flex:0 0 auto;
  background:#5867e8; display:flex; align-items:center; justify-content:center;
}
.recIcon svg{ width:22px; height:22px; color:#fff; }
.recTitle{
  font-family:var(--font);
  font-size:23px; font-weight:400; color:#181818; line-height:1.25;
  letter-spacing:-.2px;
  min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.recActions{ display:flex; align-items:center; gap:8px; flex:0 0 auto; }
.recActions .btn{ border-radius:999px; padding:7px 15px; }

.btn{
  border:1px solid var(--line-2); background:#fff; color:var(--text);
  font-size:12.5px; padding:9px 11px; border-radius:8px; cursor:pointer;
  transition: background .12s ease, border-color .12s ease, transform .08s ease;
  display:flex; gap:7px; align-items:center; white-space:nowrap;
}
.btn:hover{ background:#fafafa; border-color:#cfd6df; }
.btn:active{ transform: translateY(2px); filter:brightness(.92); }
.btn svg{ width:14px; height:14px; }
.slackIcon{ width:15px; height:15px; flex:0 0 auto; }
.btn.primary{ background:var(--blue); border-color:var(--blue); color:#fff; }
.btn.primary:hover{ background:#0165b8; border-color:#0165b8; }

/* lead health card */
.healthRow{ padding: 8px 0 4px; }
.healthLabel{ font-size:12px; color:#2e333d; margin-bottom:7px; }
.healthValue{ font-size:19px; color:#181818; font-weight:400; }
.healthSplit{ display:grid; grid-template-columns:1fr 1fr; gap:14px; padding-top:14px; margin-top:12px; }
.cmpBarOuter{ height:8px; border-radius:999px; background:#eef0f3; overflow:hidden; }
.cmpBarInner{ height:100%; border-radius:999px; background:#10b981; width:0%; transition:width .45s cubic-bezier(.4,0,.2,1); }
.cmpMeta{ font-size:12px; color:var(--muted); margin-top:7px; font-weight:500; }


/* ---------- TABBED INFO CARD ---------- */
.infoTabs{
  display:flex; gap:26px; padding:14px 24px 0 24px;
  border-bottom:1px solid #ebedf0; margin-bottom:0;
}
.itab{
  appearance:none; border:0; background:transparent; font-family:var(--font);
  font-size:15.5px; font-weight:400; color:var(--muted); cursor:pointer;
  padding:0 0 10px; position:relative;
}
.itab[aria-selected="true"]{ color:#181818; }
.itab[aria-selected="true"]::after{
  content:""; position:absolute; left:-2px; right:-2px; bottom:-1px; height:2px; background:var(--blue);
}
.itab:focus-visible{ outline:2px solid rgba(1,118,211,.25); outline-offset:3px; border-radius:6px; }
.itab-pane{ display:none; }
.itab-pane.active{ display:block; }

.secHead{
  display:flex; align-items:center; gap:9px;
  width:calc(100% - 48px); margin:16px 24px 0 24px;
  padding:10px 14px; border:0; border-radius:10px; cursor:pointer;
  background:#f7f8f9; font-family:var(--font); font-size:15px;
  font-weight:400; color:#181818; text-align:left;
  transition:background .12s ease;
}
.secHead:hover{ background:#f1f3f5; }
.secHead svg{ width:18px; height:18px; color:#706e6b; flex:0 0 auto; transition:transform .18s ease; }
.secHead.collapsed svg{ transform:rotate(-90deg); }
.secMeta{ margin-left:auto; display:flex; align-items:center; gap:9px; }
.secActions{ padding:14px 24px 6px 24px; }
.secBody{ padding:8px 24px 20px 24px; }
.secBody.flush{ padding:8px 0 8px 0; }
.secBody.hidden{ display:none; }

.infoGrid{ display:grid; grid-template-columns:1fr 1fr; column-gap:36px; }
@media (max-width:820px){ .infoGrid{ grid-template-columns:1fr; column-gap:0; } }
.infoGrid .infoSpan{ grid-column:1 / -1; }

/* ---------- SUBITEM FORM / TOTALS / LINK CHIP ---------- */
.subForm{ margin:14px 24px 0 24px; padding:16px 18px; border-radius:12px; background:#f7f8f9; }
.subForm[hidden]{ display:none; }
.subFormHead{ font-size:14px; color:#181818; margin-bottom:12px; }
.subFormGrid{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px 16px; }
@media (max-width:820px){ .subFormGrid{ grid-template-columns:1fr 1fr; } }
.subField{ display:flex; flex-direction:column; gap:5px; min-width:0; }
.subField.wide{ grid-column:span 2; }
@media (max-width:820px){ .subField.wide{ grid-column:span 2; } }
.subField > span{ font-size:12px; color:#2e333d; display:flex; gap:6px; align-items:center; }
.subField em{ font-style:normal; font-size:10.5px; color:#b45309; background:#fef3c7; padding:1px 6px; border-radius:4px; }
.subField .inline-input{ background:#fff; }
.subField .inline-input.invalid{ border-color:#dc2626; box-shadow:0 0 0 1px #dc2626; }
.subField .pickTrigger{ background:#fff; border-color:var(--line-2); min-width:0; width:100%; }
.subFormFoot{ display:flex; align-items:center; gap:10px; margin-top:14px; }
.subHint{ font-size:12px; color:var(--muted); margin-right:auto; }
.subHint.bad{ color:#b91c1c; }


.linkChip{
  display:inline-flex; align-items:center; justify-content:center;
  width:24px; height:24px; flex:0 0 auto; margin-left:2px;
  border:0; border-radius:6px; background:transparent; cursor:pointer;
  color:#c4c9d4; transition:color .12s ease, background .12s ease;
}
.linkChip.has{ color:var(--blue); }
.linkChip:hover{ background:rgba(0,0,0,.05); color:#0b5cab; }
.linkChip svg{ width:14px; height:14px; }

/* A link that is attached becomes a one-click open button, with a quiet
   pencil beside it for changing the URL. */
.linkPair{ display:inline-flex; align-items:center; gap:6px; flex:0 0 auto; margin-left:12px; }
.linkOpen{
  display:inline-flex; align-items:center; gap:5px; flex:0 0 auto;
  font-family:var(--font); font-size:13px; font-weight:400; line-height:1;
  padding:0; border:0; background:transparent; cursor:pointer; white-space:nowrap;
  color:var(--blue); transition:color .12s ease;
}
.linkOpen:hover{ text-decoration:underline; color:#0b5cab; }
.linkOpen svg{ width:12px; height:12px; flex:0 0 auto; }
.linkAdd{
  display:inline-flex; align-items:center; gap:5px; flex:0 0 auto;
  font-family:var(--font); font-size:13px; line-height:1;
  padding:0; border:0; background:transparent; cursor:pointer; white-space:nowrap;
  color:#9ca3af; transition:color .12s ease;
}
.linkAdd:hover{ color:var(--blue); text-decoration:underline; }
.linkEdit{
  display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto;
  width:22px; height:22px; border:0; border-radius:6px; background:transparent;
  color:#c4c9d4; cursor:pointer; opacity:0; transition:opacity .12s ease, color .12s ease;
}
.slds-field:hover .linkEdit{ opacity:1; }
.linkEdit:hover{ color:var(--blue); background:rgba(0,0,0,.05); }
.linkEdit svg{ width:13px; height:13px; }
.linkEditor{ padding:6px 0 4px; }

/* ---------- PICKLIST DROPDOWN ---------- */
.pickTrigger{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  width:100%; min-width:0; font-family:var(--font); font-size:15px; font-weight:400;
  color:#080707; background:transparent; border:1px solid transparent;
  border-radius:8px; padding:5px 8px; margin:-5px -8px; cursor:pointer; text-align:left;
  transition:border-color .12s ease, background .12s ease, box-shadow .12s ease;
}
.pickTrigger:hover{ border-color:var(--line-2); background:#fff; }
.pickTrigger[aria-expanded="true"]{
  border-color:var(--blue); background:#fff; box-shadow:0 0 0 1px var(--blue);
}
.pickTrigger.empty .pickValue{ color:#9ca3af; font-style:italic; }
.pickValue{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pickCaret{ width:11px; height:11px; color:#706e6b; flex:0 0 auto; transition:transform .16s ease; }
.pickTrigger[aria-expanded="true"] .pickCaret{ transform:rotate(180deg); }

/* compact variant used inside the heirs table */
.pickRow .pickTrigger{ width:auto; flex:1 1 auto; }
.pickTrigger.compact{
  font-size:13px; padding:5px 7px; margin:0; min-width:140px;
  border-radius:6px;
}
.pickTrigger.compact.narrow{ min-width:88px; }
/* the heirs table gets a larger caret — it is a denser grid to scan */
.pickTrigger.compact .pickCaret{ width:15px; height:15px; }

.pickPanel{
  position:fixed; z-index:2000; background:#fff; border-radius:10px;
  box-shadow:0 6px 24px rgba(16,24,40,.16), 0 0 0 1px rgba(16,24,40,.06);
  padding:0 0 6px 0; overflow:hidden auto; max-height:min(340px, 60vh);
  font-family:var(--font);
}
.pickHead{
  font-size:13px; font-weight:500; color:#0b5cab;
  padding:12px 16px 10px 16px; border-bottom:1px solid #ebedf0; margin-bottom:4px;
  position:sticky; top:0; background:#fff;
}
.pickOpt{
  display:flex; align-items:center; gap:9px; width:100%;
  font-family:var(--font); font-size:14px; font-weight:400; color:#181818;
  background:transparent; border:0; text-align:left; cursor:pointer;
  padding:9px 16px 9px 28px;
  transition:background .1s ease;
}
.pickOpt:hover{ background:#f3f3f3; }
.pickOpt.selected{ color:#0b5cab; }
.pickOpt .pickCheck{ position:absolute; left:9px; width:13px; height:13px; }
.pickOptWrap{ position:relative; display:flex; }

/* ---------- CONTENT ---------- */
.tab-content{ padding:7px 0 0; }
.tab-pane{ display:block; }

/* ---------- STAGE PATH ---------- */
.pathWrap{ padding: 12px 24px 4px 24px; display:flex; align-items:center; gap:12px; }
.pathStack{ flex:1; min-width:0; }
.pathGroups{ display:flex; margin-bottom:5px; }
.pathGroup{
  min-width:0; padding:0 2px 5px 2px; position:relative;
  font-size:11px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--muted-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.pathGroup::after{
  content:""; position:absolute; left:2px; right:8px; bottom:0; height:1px; background:#e2e5e9;
}
.pathGroup.active{ color:#0d1f6e; }
.pathGroup.active::after{ background:#0d1f6e; }
.pathCollapse{
  width:26px; height:26px; border-radius:50%; border:1px solid var(--line-2);
  background:#fff; color:#514f4d; cursor:pointer; flex:0 0 auto;
  display:flex; align-items:center; justify-content:center; transition:background .12s ease;
}
.pathCollapse:hover{ background:#f3f4f6; }
.pathCollapse svg{ width:13px; height:13px; transition:transform .2s ease; }
.pathWrap.collapsed .pathCollapse svg{ transform:rotate(-90deg); }

.path{ display:flex; flex:1; min-width:0; }
.pathItem{
  font-family:var(--font);
  flex:1; min-width:0; height:30px; border:0; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:6px;
  font-size:12.5px; font-weight:400; letter-spacing:.01em;
  background:#e5e5e5; color:#514f4d; margin-right:0;
  clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%, 12px 50%);
  padding: 0 6px 0 12px;
  margin-left:-7px;
  transition: background .16s ease, color .16s ease;
  white-space:nowrap; overflow:hidden;
}
.pathItem:first-child{ clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%); padding-left:16px; margin-left:0; border-radius:999px 0 0 999px; }
.pathItem:last-child{ margin-right:0; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 12px 50%); border-radius:0 999px 999px 0; }
.pathItem:hover{ background:#dedcda; }
.pathItem.done{ background:#a5e8cf; color:#0a5c3c; }
.pathItem.done:hover{ background:#b0e0c8; }
.pathItem.current{ background:#0d1f6e; color:#fff; }
.pathItem.current:hover{ background:#081c58; }
.pathItem svg{ width:12px; height:12px; flex:0 0 auto; }
.pathLabel{ overflow:hidden; text-overflow:ellipsis; }
.pathSub{ font-size:10.5px; font-weight:500; opacity:.75; }

/* ---------- 3-COLUMN RECORD GRID ---------- */
.recGrid{
  display:grid;
  grid-template-columns: minmax(240px,0.55fr) minmax(0,1.45fr);
  gap:11px;
  padding: 0 0 24px 0;
  align-items:start;
}
@media (max-width:900px){ .recGrid{ grid-template-columns:1fr; } }
.colStack{ display:flex; flex-direction:column; gap:11px; min-width:0; }

.card{
  background:var(--card); border:0; border-radius:14px;
  box-shadow:0 1px 3px rgba(16,24,40,.06); overflow:hidden;
}
.cardHead{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:20px 24px 8px 24px; border:0;
}
.cardHead h3{ margin:0; font-family:var(--font); font-size:19.5px; font-weight:400; color:#181818; letter-spacing:-.15px; }
.cardHead .meta{ font-size:12px; color:var(--muted); font-weight:500; }
.cardBody{ padding: 4px 24px 20px 24px; }
.cardBody.flush{ padding:0 0 8px 0; }

.cardTitle{
  font-family:var(--font); font-size:19.5px; font-weight:400;
  color:#181818; letter-spacing:-.15px; line-height:1.3;
}

/* ---------- SLDS FIELD ROWS ---------- */
.slds-field{
  display:flex; flex-direction:column; padding:10px 0 4px 0;
  border-bottom:1px solid #ebedf0; min-width:0;
}
.slds-field:last-child{ border-bottom:1px solid #ebedf0; }
.slds-label{
  font-size:12px; font-weight:400; color:#2e333d; line-height:1.3;
  margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  display:flex; align-items:center; gap:5px;
}
.slds-value{ display:flex; align-items:center; justify-content:space-between; gap:6px; min-width:0; }
.value-text{
  font-size:15px; color:#080707; font-weight:400; line-height:1.4; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.value-text.multiline{ white-space:normal; }
.value-text.link{ color:var(--blue); cursor:pointer; }
.value-text.link:hover{ text-decoration:underline; }
.value-text.empty{ color:#9ca3af; font-style:italic; }
/* the whole value reads as editable, not just the pencil */
.value-text[data-editable]:not(.link){ cursor:text; border-radius:4px; padding:1px 4px; margin-left:-4px; }
.slds-field:hover .value-text[data-editable]:not(.link){ background:rgba(13,31,110,.045); }
/* Low tax bill / low equity — flagged so the VA re-checks it is worth working */
.value-text.flag{ color:#c0281f; font-weight:500; }
.valWrap{ display:flex; align-items:center; gap:7px; min-width:0; }
.flagIcon{ width:13px; height:13px; color:#c0281f; flex:0 0 auto; }
.edit{
  opacity:.55; transition:opacity .1s ease, color .1s ease, background .1s ease;
  color:#c4c9d4; cursor:pointer; flex:0 0 auto; display:flex; align-items:center;
  padding:2px 3px; border-radius:4px;
}
.slds-field:hover .edit{ opacity:1; }
.edit{ color:#0b5cab; }
.edit:hover{ color:#686D73; background:rgba(0,0,0,.04); }
.edit svg{ width:16px; height:16px; display:block; }
.inline-input{
  width:100%; font-family:var(--font); font-size:15px; padding:6px 10px;
  border:1px solid #b9bdc4; border-radius:8px; outline:none;
}
.inline-input:focus{ border-color:var(--navy); box-shadow:0 0 0 1px var(--navy); }

.reqDot{
  width:5px; height:5px; border-radius:50%; background:#dc2626; flex:0 0 auto;
}

/* ---------- GUIDANCE PANEL ---------- */
.guidHead{
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  padding:8px 24px 4px 24px;
}
.guidStatus{ font-size:17.5px; font-weight:400; color:#181818; letter-spacing:-.2px; }
.guidStatus span{ color:#181818; font-weight:400; }
.guidBody{ padding:4px 24px 12px 24px; display:grid; grid-template-columns:1.5fr 1fr; gap:0 32px; align-items:start; }
@media (max-width:900px){ .guidBody{ grid-template-columns:1fr; } }
.btnStage{
  border:0; background:var(--blue); color:#fff; font-family:var(--font);
  font-size:13.5px; font-weight:500; padding:7px 18px; border-radius:999px;
  cursor:pointer; display:flex; align-items:center; gap:8px; white-space:nowrap;
  transition:background .12s ease, transform .08s ease;
}
.btnStage:hover{ background:#0165b8; }
.guidActions{ display:flex; align-items:center; gap:9px; flex:0 0 auto; }
.btnBlock{
  border:1px solid var(--line-2); background:#fff; color:#6b7280;
  font-family:var(--font); font-size:13px; font-weight:400;
  padding:6px 14px; border-radius:999px; cursor:pointer;
  transition:background .12s ease, color .12s ease, border-color .12s ease;
}
.btnBlock:hover{ background:#fdf3f3; border-color:#f0c9c9; color:#b91c1c; }
.btnBlock.on{ background:#fee2e2; border-color:#fca5a5; color:#991b1b; }
.blockBanner[hidden]{ display:none; }
.blockBanner{
  display:flex; align-items:flex-start; gap:9px;
  margin:8px 24px 0 24px; padding:11px 14px; border-radius:10px;
  background:#fef2f2; color:#991b1b; font-size:13px; line-height:1.5;
}
.blockBanner strong{ font-weight:500; }
.blockBanner .clearBlock{
  margin-left:auto; background:none; border:0; color:#991b1b; cursor:pointer;
  font-family:var(--font); font-size:12.5px; text-decoration:underline; white-space:nowrap;
}
.pathItem.blocked{ background:#fca5a5 !important; color:#7f1d1d !important; }
.btnStage:active{ transform:translateY(1px); }
.btnStage svg{ width:14px; height:14px; }
.guidLabel{
  font-size:14px; letter-spacing:0; text-transform:none;
  color:#181818; font-weight:400; margin: 2px 0 8px;
}
.guidList{ margin:0; padding:0 0 6px 0; list-style:none; }
.guidList li{
  font-size:13.5px; color:#374151; line-height:1.5; padding:0 0 5px 16px;
  position:relative;
}
.guidList li::before{
  content:"\2013"; position:absolute; left:1px; top:-1px;
  color:#9aa3af; font-size:13px;
}

/* requirements to advance */
.reqGrid{ display:grid; grid-template-columns:1fr; gap:6px; padding-bottom:2px; }
.reqGrid.split{ grid-template-columns:1fr 1fr; gap:0 26px; }
.reqCol{ display:flex; flex-direction:column; gap:6px; min-width:0; }
@media (max-width:640px){ .reqGrid{ grid-template-columns:1fr; } }
.reqItem{ display:flex; align-items:center; gap:8px; font-size:12.5px; line-height:1.4; }
.reqIcon{ width:15px; height:15px; flex:0 0 auto; }
.reqItem.met{ color:#065f46; }
.reqItem.unmet{ color:#8b1a1a; }
.reqItem.na{ color:#9aa3af; }
.reqItem.na .reqName{ text-decoration:line-through; text-decoration-color:#d5d9de; }
.reqItem .reqName{ overflow:hidden; white-space:normal; overflow-wrap:anywhere; }

.guidFoot{
  display:flex; align-items:center; gap:12px;
  padding:0 24px 10px 24px; border:0; background:transparent;
}
.guidFootNote{ font-size:12px; color:var(--muted); }

/* ---------- SOURCE LINKS ---------- */
.linkRow{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:10px 22px; border-bottom:1px solid #f4f5f7;
}
.linkRow:last-child{ border-bottom:0; }
.linkLeft{ display:flex; align-items:center; gap:9px; min-width:0; }
.linkStatus{ width:7px; height:7px; border-radius:50%; flex:0 0 auto; }
.linkStatus.have{ background:#10b981; }
.linkStatus.missing{ background:#d1d5db; }
.linkName{ font-size:13.5px; color:#374151; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.linkAction{
  font-size:12.5px; color:var(--blue); cursor:pointer; background:none; border:0;
  padding:2px 4px; border-radius:4px; white-space:nowrap;
}
.linkAction:hover{ text-decoration:underline; }
.linkAction.add{ color:var(--muted); }

/* ---------- DATA TABLE (heirs) ---------- */
.rct-scroll{ width:100%; overflow-x:auto; }
.rct-scroll::-webkit-scrollbar{ height:9px; }
.rct-scroll::-webkit-scrollbar-thumb{ background:#d6dae0; border-radius:999px; }
.rct-table .colName{ min-width:190px; }
.rct-table .colAddr{ min-width:230px; }
.cellEmpty{ color:#9ca3af; font-style:italic; }
.cellInput.nameCell{ color:var(--blue); }
.cellInput{

  border:1px solid transparent; background:transparent; border-radius:6px;
  padding:5px 7px; width:100%; min-width:120px;

.rct-table tbody td{

.rct-row{ cursor:pointer; }
.rct-row:hover td{ background:#f3f3f3; }
.rct-link{ color:var(--blue); text-decoration:none; }
.rct-row:hover .rct-link{ text-decoration:underline; }

.emptyState{ padding:22px 16px; font-size:13.5px; color:#9ca3af; font-style:italic; }

/* ---------- TOAST ---------- */
#toast{
  position:fixed; right:22px; bottom:26px; z-index:9999;
  background:#0a5c3c; color:#fff; font-size:13.5px; font-weight:500;
  padding:11px 16px; border-radius:9px; box-shadow:0 6px 22px rgba(0,0,0,.18);
  opacity:0; transform:translateY(8px); pointer-events:none;
  transition:opacity .2s ease, transform .2s ease;
}
#toast.show{ opacity:1; transform:translateY(0); }
#toast.err{ background:#8b1a1a; }

@media (prefers-reduced-motion: reduce){

const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ── Picklist dropdown ─────────────────────────────────────── */
let openPicker = null;

function closePicker(){
  if (!openPicker) return;
  openPicker.panel.remove();
  openPicker.trigger.setAttribute("aria-expanded","false");
  openPicker = null;
}

function showPicker(trigger, title, options, value, onSelect){
  const reopening = openPicker && openPicker.trigger === trigger;
  closePicker();
  if (reopening) return;

  const panel = document.createElement("div");
  panel.className = "pickPanel";
  panel.innerHTML = `<div class="pickHead">Suggested ${esc(title)}</div>` +
    options.map(o => `<div class="pickOptWrap">
      <button class="pickOpt ${o === value ? 'selected' : ''}" type="button" data-val="${esc(o)}">
        ${o === value ? '<svg class="pickCheck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>' : ''}
        ${esc(o)}
      </button></div>`).join("");
  document.body.appendChild(panel);

  trigger.setAttribute("aria-expanded","true");
  openPicker = { trigger, panel, onSelect };
  positionPicker();
}

function positionPicker(){
  if (!openPicker) return;
  const { trigger, panel } = openPicker;
  const r = trigger.getBoundingClientRect();
  if (r.bottom < 0 || r.top > window.innerHeight){ closePicker(); return; }
  panel.style.minWidth = Math.max(r.width, 200) + "px";
  panel.style.left = Math.max(8, Math.min(r.left, window.innerWidth - panel.offsetWidth - 12)) + "px";
  const below = window.innerHeight - r.bottom;
  panel.style.top = (below < panel.offsetHeight + 12 && r.top > below)
    ? Math.max(8, r.top - panel.offsetHeight - 6) + "px"
    : (r.bottom + 5) + "px";
}

document.addEventListener("click", e => {
  const opt = e.target.closest(".pickOpt");
  if (opt && openPicker){
    const cb = openPicker.onSelect;
    const v = opt.dataset.val;
    closePicker();
    cb(v);
    return;
  }
  if (openPicker && !e.target.closest(".pickTrigger")) closePicker();
}, true);
document.addEventListener("keydown", e => { if (e.key === "Escape") closePicker(); });
window.addEventListener("resize", closePicker);
window.addEventListener("scroll", e => {
  if (!openPicker) return;
  if (openPicker.panel.contains(e.target)) return;   // scrolling the list itself
  positionPicker();                                   // follow the trigger instead of closing
}, true);

function pickTrigger(value, placeholder, extra){
  const filled = !!(value && String(value).trim());
  return `<button class="pickTrigger ${extra || ''} ${filled ? '' : 'empty'}" type="button" aria-expanded="false">
    <span class="pickValue">${filled ? esc(value) : esc(placeholder || 'Select')}</span>
    <svg class="pickCaret" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
  </button>`;
}

let toastTimer;
function toast(msg, isErr){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.toggle("err", !!isErr);
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2500);
}

function owners(){ return HEIRS.filter(h => h.owner === "Yes"); }

function hasValue(key){
  if (key === "heirs_min_1")      return HEIRS.length > 0;
  if (key === "heirs_contactable")return HEIRS.some(h => h.owner === "Yes" && (h.p1 || h.addr));
  if (key === "heirs_mapped")     return owners().length > 0 &&
                                    owners().every(h => h.name && h.rel && h.addr && h.p1);
  if (key.endsWith("_link"))      return !!(LINKS[key] && LINKS[key].url);
  return !!(DATA[key] && String(DATA[key]).trim());
}

/* "$11,480" -> 11480, so threshold rules can read the typed values */
function money(v){
  const n = parseFloat(String(v ?? "").replace(/[^0-9.]/g, ""));
  return isNaN(n) ? null : n;
}
const lowTaxBill = v => { const n = money(v); return n !== null && n <= 2500; };
const lowEquity  = v => { const n = money(v); return n !== null && n <= 130000; };

const ICON_OPEN = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"/></svg>`;
const ICON_CLIP = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>`;

/* The chain button — attaches or changes a URL */
function linkEditBtn(k){
  const l = LINKS[k];
  if (!l) return "";
  return `<button class="linkEdit" type="button" data-linkfield="${k}" title="${l.url ? 'Change' : 'Attach'} the ${esc(l.label)} link">${ICON_CLIP}</button>`;
}

/* Attached -> a text link that opens in one click, plus a hover-only chain
   button to change it.  Missing -> a quiet "add" text button. */
function linkChip(k){
  const l = LINKS[k];
  if (!l) return "";
  if (l.url){
    return `<span class="linkPair">
      <button class="linkOpen" type="button" data-openlink="${k}" title="Open the ${esc(l.label)} link">Open${ICON_OPEN}</button>
      ${linkEditBtn(k)}
    </span>`;
  }
  return `<button class="linkAdd" type="button" data-linkfield="${k}" title="Attach the ${esc(l.label)} link">${ICON_CLIP}${esc(l.label)}</button>`;
}

const FLAG = `<svg class="flagIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5z" fill="currentColor" stroke="none"/><path d="M5 4h11l-2 4 2 4H5z"/></svg>`;

const PENCIL = `<span class="edit" title="Edit"><svg viewBox="0 0 24 24" fill="none"><path d="M12 20h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`;

/* Renders a source link as its own field row. "Click Here" opens it outright. */
function linkFieldRow(linkKey, label, opts){
  opts = opts || {};
  const l = LINKS[linkKey];
  const has = !!(l && l.url);
  return `<div class="slds-field" data-field="${linkKey}">
    <div class="slds-label">${esc(label)}${opts.required && !has ? '<span class="reqDot" title="Required to advance"></span>' : ''}</div>
    <div class="slds-value">
      ${has
        ? `<span class="value-text link" data-openlink="${linkKey}">Click Here</span>
           <button class="linkEdit" type="button" data-linkfield="${linkKey}" title="Change the ${esc(l.label)} link">${ICON_CLIP}</button>`
        : `<span class="value-text empty">${esc(opts.placeholder || "Attach link")}</span>${linkChip(linkKey)}`}
    </div>
  </div>`;
}

/* Renders one editable SLDS field row */
function fieldRow(key, label, opts){
  opts = opts || {};
  const v = DATA[key];
  const filled = !!(v && String(v).trim());
  const required = opts.required;
  const linkKeys = opts.linkFields || (opts.linkField ? [opts.linkField] : []);
  const linkKey = linkKeys[0];
  const linkable = linkKey && LINKS[linkKey] && LINKS[linkKey].url;
  const cls = ["value-text"];
  if (!filled) cls.push("empty");
  if (opts.multiline) cls.push("multiline");
  if (filled && opts.flag && opts.flag(v)) cls.push("flag");
  const flagged = filled && opts.flag && opts.flag(v);
  const shown = filled ? esc(v) : (opts.placeholder || "Add value");
  /* When a row carries a required link too, the dot stays until both halves are done */
  const needsDot = required && (!filled || (opts.linkRequired && !linkable));
  const head = `<div class="slds-label">${esc(label)}${needsDot ? '<span class="reqDot" title="Required to advance"></span>' : ''}</div>`;

  /* On a plain text row the value doubles as the link, so the only control
     needed is the chain button. Dropdown rows keep the separate open button
     because their value is the picklist trigger. */
  const isPick = !!PICKLISTS[key];
  const valueOpens = !isPick && linkable && linkKeys.length === 1;
  if (valueOpens) cls.push("link");
  const chip = valueOpens ? linkEditBtn(linkKey) : linkKeys.map(linkChip).join("");

  if (PICKLISTS[key]){
    return `<div class="slds-field pickRow" data-field="${key}">
      ${head}
      <div class="slds-value">${pickTrigger(v, opts.placeholder || "Select")}${chip}</div>
    </div>`;
  }

  const valueSpan =
    `<span class="${cls.join(' ')}" data-editable="true"${valueOpens ? ` data-openlink="${linkKey}"` : ''}>${shown}</span>`;
  const body = flagged
    ? `<span class="valWrap">${valueSpan}${FLAG}</span>`
    : valueSpan;

  return `<div class="slds-field" data-field="${key}">
    ${head}
    <div class="slds-value">
      ${body}
      ${chip}${PENCIL}
    </div>
  </div>`;
}


/* ══════════════════════════════════════════════════════════
   RENDER: STAGE PATH
   ══════════════════════════════════════════════════════════ */
function renderPath(){
  const runs = [];
  STAGES.forEach((st, i) => {
    const last = runs[runs.length - 1];
    if (last && last.key === st.group) last.count++;
    else runs.push({ key: st.group, count: 1 });
  });
  let idx = 0;
  $("#pathGroups").innerHTML = runs.map(r => {
    const active = currentStage >= idx && currentStage < idx + r.count;
    idx += r.count;
    return `<div class="pathGroup ${active ? 'active' : ''}" style="flex:${r.count}" title="${esc(GROUPS[r.key])}">${esc(GROUPS[r.key])}</div>`;
  }).join("");

  $("#path").innerHTML = STAGES.map((s, i) => {
    let cls = "pathItem", inner = "";
    if (i < currentStage){
      cls += " done";
      inner = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg><span class="pathLabel">${esc(s.name)}</span>`;
    } else if (i === currentStage){
      cls += blocked ? " current blocked" : " current";
      inner = `<span class="pathLabel">${esc(s.name)}</span>`;
    } else {
      inner = `<span class="pathLabel">${esc(s.name)}</span>`;
    }
    return `<button class="${cls}" type="button" data-stage="${i}" title="${esc(s.name)}">${inner}</button>`;
  }).join("");
}

/* ══════════════════════════════════════════════════════════
   RENDER: GUIDANCE + REQUIREMENTS
   ══════════════════════════════════════════════════════════ */
function renderGuidance(){
  const s = STAGES[currentStage];
  $("#guidStatusName").textContent = s.name;

  const bb = $("#blockBanner");
  if (blocked){
    bb.hidden = false;
    bb.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:16px;height:16px;flex:0 0 auto;margin-top:1px;"><circle cx="12" cy="12" r="9"/><path d="M8.5 8.5 15.5 15.5"/></svg>
      <div><strong>Blocked &mdash; ${esc(blocked.reason)}</strong><br>This lead is not moving. It stays in ${esc(GROUPS[s.group])} and does not count as idle.</div>
      <button class="clearBlock" type="button" id="clearBlockBtn">Clear block</button>`;
  } else {
    bb.hidden = true;
    bb.innerHTML = "";
  }
  $("#btnBlock").classList.toggle("on", !!blocked);
  $("#btnBlock").textContent = blocked ? "Blocked" : "Flag blocked";
  $("#guidList").innerHTML = s.guidance.map(g => `<li>${esc(g)}</li>`).join("");

  const conds  = (s.conditional || []).map(c => Object.assign({}, c, { active: c.when() }));
  const gates  = s.requires.concat(conds.filter(c => c.active).map(c => c.key));
  const met    = gates.filter(hasValue);
  const unmet  = gates.filter(k => !hasValue(k));

  const OK   = `<svg class="reqIcon" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" stroke-width="1.8"/><path d="m8 12 2.8 2.8L16 9.5"/></svg>`;
  const BAD  = `<svg class="reqIcon" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4.5" stroke-width="2.4"/><circle cx="12" cy="16.2" r="1" fill="#dc2626" stroke="none"/></svg>`;
  const NA   = `<svg class="reqIcon" viewBox="0 0 24 24" fill="none" stroke="#b6bcc4" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12h7.6" stroke-width="2.2"/></svg>`;

  const row = (k, state, note) =>
    `<div class="reqItem ${state}"${note ? ` title="${esc(note)}"` : ''}>
       ${state === 'met' ? OK : state === 'na' ? NA : BAD}
       <span class="reqName">${esc(REQ_LABEL[k] || k)}</span>
     </div>`;

  const rows = s.requires.map(k => row(k, hasValue(k) ? 'met' : 'unmet'))
    .concat(conds.map(c => c.active
      ? row(c.key, hasValue(c.key) ? 'met' : 'unmet', c.why)
      : row(c.key, 'na', c.na)
    ));

  /* Long lists break into two columns instead of one endless run.
     COL_BREAK = 5 puts the break right after Tax Lawsuit Status on Records Pulling. */
  const COL_BREAK = 5;
  const grid = $("#reqGrid");
  if (rows.length > 6){
    grid.classList.add("split");
    grid.innerHTML =
      `<div class="reqCol">${rows.slice(0, COL_BREAK).join("")}</div>` +
      `<div class="reqCol">${rows.slice(COL_BREAK).join("")}</div>`;
  } else {
    grid.classList.remove("split");
    grid.innerHTML = rows.join("");
  }

  $("#guidFootNote").textContent = unmet.length === 0
    ? "All requirements met for this status."
    : `${met.length} of ${gates.length} requirements met.`;
  $("#btnAdvanceLabel").textContent = currentStage === STAGES.length - 1
    ? "Release to Sales Floor"
    : "Mark Status as Complete";
}

/* ══════════════════════════════════════════════════════════
   RENDER: REMINDERS  (stage-based + data-driven)
   ══════════════════════════════════════════════════════════ */
function renderReminders(){
  if (!$("#remList")) return;
  const s = STAGES[currentStage];
  const items = s.reminders.slice();

  // Data-driven reminders layered on top of the stage's hardcoded ones
  if (DATA.probate_status === "No Open Cases"){
    items.push({ type:"warn", title:"No probate on file", body:"Texas intestate succession applies and nobody has legal authority to sell yet. Heir order is set by statute — sales needs to know an heir must open probate first." });
  }
  if (DATA.occupancy === "Vacant"){
    items.push({ type:"warn", title:"Vacant property", body:"Check for code violations and confirm the structure is still standing before verification." });
  }
  if (HEIRS.some(h => h.owner === "Yes" && !h.p1 && !h.addr)){
    const n = HEIRS.filter(h => h.owner === "Yes" && !h.p1 && !h.addr).length;
    items.push({ type:"info", title:`${n} heir${n>1?'s':''} with no contact method`, body:"Skip trace is incomplete until every non-excluded heir has a phone or a deliverable address." });
  }

  const icons = {
    stop:`<svg class="remIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 8.5 15.5 15.5"/></svg>`,
    warn:`<svg class="remIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4.5"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg>`,
    info:`<svg class="remIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="7.8" r=".7" fill="currentColor"/></svg>`
  };

  $("#remList").innerHTML = items.map(r =>
    `<div class="remCard ${r.type}">${icons[r.type]}<div><span class="remTitle">${esc(r.title)}</span>${esc(r.body)}</div></div>`
  ).join("");
  $("#remCount").textContent = items.length + " active";
}

/* ══════════════════════════════════════════════════════════
   RENDER: HEIRS
   ══════════════════════════════════════════════════════════ */
function cellInputHTML(v, idx, field, placeholder, extra){
  return `<input class="cellInput ${extra || ''}" value="${esc(v || '')}" placeholder="${esc(placeholder || '')}"
    data-heir="${idx}" data-field="${field}" />`;
}
function heirPick(value, idx, field, extra){
  return pickTrigger(value, "Select", `compact heirPick ${extra || ''}`)
    .replace('<button ', `<button data-heir="${idx}" data-field="${field}" `);
}
function renderHeirs(){
  if (!HEIRS.length){
    $("#heirTable").innerHTML = `<tbody><tr><td class="emptyState">No heirs identified yet. Start from the obituary.</td></tr></tbody>`;
    { const hc = $("#heirCount"); if (hc) hc.textContent = "0"; }
    return;
  }
  $("#heirTable").innerHTML =
    `<thead><tr>
        <th class="colName">Name</th><th>Relationship</th><th>Owner</th><th>Ownership %</th>
        <th class="colAddr">Address</th><th>Phone 1</th><th>Phone 2</th><th>Phone 3</th><th>Phone 4</th>
      </tr></thead>
     <tbody>${HEIRS.map((h, i) => `<tr class="rct-row">
        <td class="colName">${cellInputHTML(h.name, i, "name", "Heir name", "nameCell")}</td>
        <td>${heirPick(h.rel, i, "rel")}</td>

        <td class="colAddr">${cellInputHTML(h.addr, i, "addr", "Add address")}</td>
        <td>${cellInputHTML(h.p1, i, "p1", "Add phone")}</td>
        <td>${cellInputHTML(h.p2, i, "p2", "Add phone")}</td>
        <td>${cellInputHTML(h.p3, i, "p3", "Add phone")}</td>
        <td>${cellInputHTML(h.p4, i, "p4", "Add phone")}</td>
      </tr>`).join("")}</tbody>`;



  { const hc = $("#heirCount"); if (hc) hc.textContent = HEIRS.length; }

}

/* ══════════════════════════════════════════════════════════
   RENDER: SNAPSHOT + COMPLETENESS
   ══════════════════════════════════════════════════════════ */
function renderSnapshot(){
  $$("[data-snap]").forEach(el => {
    const k = el.getAttribute("data-snap");
    const v = DATA[k];
    el.textContent = (v && String(v).trim()) ? v : "—";
  });
  $("#hdrAddress").textContent = DATA.property_address || "Untitled lead";

  const filled = TRACKED.filter(hasValue).length;
  const pct = Math.round(filled / TRACKED.length * 100);
  const bar = $("#cmpBar");
  if (bar){
    bar.style.width = pct + "%";
    bar.style.background = pct >= 90 ? "#10b981" : pct >= 60 ? "#f59e0b" : "#ef4444";
    $("#cmpMeta").textContent = `${filled} of ${TRACKED.length} fields · ${pct}%`;
  }
}

/* ══════════════════════════════════════════════════════════
   RENDER ALL
   ══════════════════════════════════════════════════════════ */
function renderAll(){
  renderPath();
  renderGuidance();
  renderReminders();
  renderFields();
  renderHeirs();
  renderSnapshot();
}

   INTERACTIONS

  const t = e.target.closest(".itab");
  if (!t) return;
  const card = t.closest("#cardInfo");
  card.querySelectorAll(".itab").forEach(x => x.setAttribute("aria-selected", String(x === t)));

});

/* Collapsible section headers */
document.addEventListener("click", e => {
  const h = e.target.closest(".secHead");
  if (!h) return;
  h.classList.toggle("collapsed");
  document.getElementById(h.dataset.section).classList.toggle("hidden");
});

/* Stage path */
document.addEventListener("click", e => {
  const item = e.target.closest(".pathItem");
  if (!item) return;
  currentStage = Number(item.dataset.stage);
  renderPath(); renderGuidance(); renderReminders(); renderFields(); renderSnapshot();

/* Collapse guidance from the path chevron — path itself stays visible */
$("#pathCollapseBtn").addEventListener("click", () => {
  const w = $("#pathWrap");
  w.classList.toggle("collapsed");
  const hidden = w.classList.contains("collapsed");
  ["#guidHead","#guidBody","#guidFoot"].forEach(sel => {
    const el = $(sel);
    if (el) el.style.display = hidden ? "none" : "";
  });

/* Field picklists */
document.addEventListener("click", e => {
  const trig = e.target.closest(".pickRow .pickTrigger");
  if (!trig) return;
  const key = trig.closest(".slds-field").dataset.field;
  const pl = PICKLISTS[key];
  showPicker(trig, pl.title, pl.options, DATA[key], val => {
    DATA[key] = val;
    renderAll();
    toast(pl.title + " set to " + val);
  });

/* Heir table picklists */
document.addEventListener("click", e => {
  const trig = e.target.closest(".heirPick");
  if (!trig) return;
  const i = Number(trig.dataset.heir), field = trig.dataset.field;
  const isRel = field === "rel";
  showPicker(trig, isRel ? "Relationships" : "Owner",
    isRel ? RELATIONSHIPS : OWNER_STATUSES, HEIRS[i][field], val => {
      HEIRS[i][field] = val;
      renderAll();
      toast("Sub-item updated");
    });
});

/* Inline edit */
document.addEventListener("click", e => {
  const pencil = e.target.closest(".edit");
  const valueEl = e.target.closest(".value-text");

  if (valueEl && valueEl.dataset.href && !pencil){
    openLink(valueEl.dataset.href);
    return;
  }
  /* A value that doubles as a link opens on click, so editing stays on the pencil */
  if (valueEl && valueEl.dataset.openlink && !pencil) return;

  /* Otherwise the value itself is the edit target — the pencil is just a hint */
  const trigger = pencil || (valueEl && valueEl.dataset.editable ? valueEl : null);
  if (!trigger) return;

  const field = trigger.closest(".slds-field");
  if (!field) return;
  const key = field.dataset.field;
  if (!key) return;
  const holder = field.querySelector(".slds-value");
  if (holder.querySelector(".inline-input")) return;

  const original = DATA[key] || "";
  holder.innerHTML = `<input class="inline-input" value="${esc(original)}" />`;
  const box = holder.querySelector("input");
  box.focus(); box.select();

  const commit = save => {
    const next = box.value.trim();
    if (save && next === original){ renderFields(); return; }   // no-op, skip full re-render
    if (save) DATA[key] = next;
    renderAll();
    if (save) toast(`${REQ_LABEL[key] || key} saved`);
  };
  box.addEventListener("keydown", ev => {
    if (ev.key === "Enter") commit(true);
    if (ev.key === "Escape") commit(false);
  });
  box.addEventListener("blur", () => commit(true));
});

/* One click on an attached link opens it — no editor in between */
function openLink(url){
  toast("Opening " + url);
  try { window.open(url, "_blank", "noopener"); } catch (err) { /* sandboxed preview */ }
}
document.addEventListener("click", e => {
  const opener = e.target.closest("[data-openlink]");
  if (!opener) return;
  const l = LINKS[opener.dataset.openlink];
  if (l && l.url) openLink(l.url);
});

/* Attach / change a source link from its field row */
document.addEventListener("click", e => {
  const chip = e.target.closest("[data-linkfield]");
  if (!chip) return;
  const k = chip.dataset.linkfield;
  const l = LINKS[k];
  const row = chip.closest(".slds-field");
  if (row.querySelector(".linkEditor")) return;

  const editor = document.createElement("div");
  editor.className = "linkEditor";
  editor.innerHTML = `<input class="inline-input" placeholder="Paste the ${esc(l.label)} URL" value="${esc(l.url || "")}" />`;
  row.appendChild(editor);
  const box = editor.querySelector("input");
  box.focus(); box.select();

  const done = save => {
    if (save) l.url = box.value.trim();
    renderAll();
    if (save) toast(l.url ? l.label + " link saved" : l.label + " link cleared");
  };
  box.addEventListener("keydown", ev => {
    if (ev.key === "Enter") done(true);
    if (ev.key === "Escape") done(false);
  });
  box.addEventListener("blur", () => done(true));
});

/* Advance stage */
$("#btnAdvance").addEventListener("click", () => {
  const s = STAGES[currentStage];
  const gates = s.requires.concat((s.conditional || []).filter(c => c.when()).map(c => c.key));
  const unmet = gates.filter(k => !hasValue(k));
  if (unmet.length){
    toast(`${unmet.length} requirement${unmet.length>1?'s':''} still missing: ${REQ_LABEL[unmet[0]]}${unmet.length>1?'…':''}`, true);
    return;
  }
  if (blocked){
    toast("Clear the block before advancing this lead", true);
    return;
  }
  if (currentStage === STAGES.length - 1){
    toast("Released to the sales floor");
    return;
  }
  currentStage++;
  renderAll();
  toast("Advanced to " + STAGES[currentStage].name);
});

$("#btnBlock").addEventListener("click", e => {
  if (blocked){ blocked = null; renderAll(); toast("Block cleared"); return; }
  showPicker(e.currentTarget, "Block Reasons", BLOCK_REASONS, null, val => {
    blocked = { reason: val };
    renderAll();
    toast("Lead flagged as blocked");
  });
});

document.addEventListener("click", e => {
  if (!e.target.closest("#clearBlockBtn")) return;
  blocked = null; renderAll(); toast("Block cleared");
});

/* ── Add Subitem: name is mandatory, everything else is suggested ── */
let draft = { rel:"", owner:"Yes" };

function renderDraftPickers(){
  $("#subRelWrap").innerHTML   = pickTrigger(draft.rel,   "Select relationship", "compact draftPick").replace('<button ', '<button data-draft="rel" ');
  $("#subOwnerWrap").innerHTML = pickTrigger(draft.owner, "Select",              "compact narrow draftPick").replace('<button ', '<button data-draft="owner" ');
}

function openSubForm(open){
  const f = $("#subForm");
  f.hidden = !open;
  $("#btnAddSub").hidden = open;
  if (!open) return;
  draft = { rel:"", owner:"Yes" };
  ["#subName","#subPct","#subAddr","#subPhone"].forEach(sel => { $(sel).value = ""; });
  $("#subName").classList.remove("invalid");
  $("#subHint").textContent = "Everything except the name can be filled in later.";
  $("#subHint").className = "subHint";
  renderDraftPickers();
  $("#subName").focus();
}

$("#btnAddSub").addEventListener("click", () => openSubForm(true));
$("#btnSubCancel").addEventListener("click", () => openSubForm(false));

document.addEventListener("click", e => {
  const t = e.target.closest(".draftPick");
  if (!t) return;
  const field = t.dataset.draft;
  const isRel = field === "rel";
  showPicker(t, isRel ? "Relationships" : "Owner", isRel ? RELATIONSHIPS : OWNER_STATUSES, draft[field], val => {
    draft[field] = val;
    renderDraftPickers();
  });
});

function createSubitem(){
  const name = $("#subName").value.trim();
  if (!name){
    $("#subName").classList.add("invalid");
    $("#subName").focus();
    $("#subHint").textContent = "A subitem needs a name before it can be created.";
    $("#subHint").className = "subHint bad";
    return;
  }
  HEIRS.push({
    name,
    rel:   draft.rel   || "",
    owner: draft.owner || "Yes",
    pct:   $("#subPct").value.trim(),
    addr:  $("#subAddr").value.trim(),
    p1:    $("#subPhone").value.trim(),
    p2:"", p3:"", p4:""
  });
  openSubForm(false);
  renderAll();
  toast(`Subitem "${name}" created`);
}

$("#btnSubCreate").addEventListener("click", createSubitem);
$("#subForm").addEventListener("keydown", e => {
  if (e.key === "Enter"){ e.preventDefault(); createSubitem(); }
  if (e.key === "Escape") openSubForm(false);
});
$("#subName").addEventListener("input", () => $("#subName").classList.remove("invalid"));

$("#btnRefresh").addEventListener("click", () => { renderAll(); toast("Record refreshed"); });

renderAll();
</script>
